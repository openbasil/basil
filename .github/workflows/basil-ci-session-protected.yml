name: Qualify protected Basil CI session

on:
  workflow_call:
permissions: {}

jobs:
  session:
    runs-on:
      group: basil-ci
      labels: self-hosted
    environment: basil-ci-session
    permissions:
      id-token: write
    steps:
      - name: Start Basil CI session
        id: session
        uses: openbasil/basil/.github/actions/basil-ci-session@ccb3705a950cb85b84ff152b73936195ad739c1a
        with:
          basil-executable: /usr/local/bin/basil
          basil-executable-sha256: ${{ secrets.BASIL_CI_EXECUTABLE_SHA256 }}
          provider-kind: github
          expected-token-request-origin: https://pipelines.actions.githubusercontent.com
          rule-max-token-age-seconds: "300"
