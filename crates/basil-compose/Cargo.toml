[package]
name = "basil-compose"
version.workspace = true
authors.workspace = true
categories = ["config", "command-line-utilities"]
documentation = "https://docs.rs/basil-compose"
edition.workspace = true
homepage.workspace = true
keywords = ["basil", "compose", "containers", "security"]
license.workspace = true
publish = true
repository.workspace = true
rust-version = "1.88"
description = "Bounded, secret-discarding projection of Docker Compose v2 effective models for Basil."

[dependencies]
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process"] }
zeroize = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
