[package]
name = "basil-https-courier"
version.workspace = true
authors.workspace = true
autobins = false
categories = ["network-programming", "command-line-utilities"]
documentation = "https://docs.openbasil.org/"
edition.workspace = true
homepage.workspace = true
keywords = ["basil", "https", "courier", "security"]
license.workspace = true
publish = true
repository.workspace = true
rust-version = "1.88"
description = "Bounded HTTPS courier for Basil sealed invocations."

[[bin]]
name = "basil-https-courier"
path = "src/main.rs"

[features]
default = []
secure-alloc = ["mimalloc/secure"]

[dependencies]
basil-courier = { workspace = true }
basil-proto = { workspace = true }

anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
httparse = { workspace = true }
hyper = { workspace = true }
mimalloc = { workspace = true }
prost = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true, features = ["std"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }
tokio-rustls = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }

[lints]
workspace = true
