[package]
name = "basil-proto"
version.workspace = true
authors.workspace = true
categories = ["network-programming", "api-bindings"]
documentation = "https://docs.rs/basil-proto"
edition.workspace = true
homepage.workspace = true
keywords = ["basil", "grpc", "protobuf", "spiffe", "tonic"]
license.workspace = true
publish = true
repository.workspace = true
rust-version = "1.85"
description = "Generated gRPC contracts for the Basil broker and SPIFFE Workload API."

[dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_bytes = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
prost = { workspace = true }
prost-types = { workspace = true }
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }

[dev-dependencies]
# Path-only dev-dependency: stripped by `cargo package`, so it does not
# raise the published dependency floor. The COSE fixtures test round-trips
# the checked-in vectors through the strict profile.
basil-cose = { workspace = true, features = ["fixtures"] }
p256 = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[lints]
workspace = true
