[package]
name = "basil-tests"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version = "1.96"
description = "Basil live and interop integration tests."

[features]
default = []
live-e2e = []
# Harness opt-in for live tests that need the broker's JWKS/OIDC HTTP surface.
# This forwards to the separately built `basil-bin` process in `ensure_binaries_built`.
http = []
# BIP39 break-glass unlock: enables `boot_basil_bip39` + `seal_bip39_bundle` in the
# harness and the `bip39_unlock_e2e` live test (basil-bp30). Additive; on under
# `--all-features`. The harness-built `basil` binary carries `unlock-bip39` by default.
unlock-bip39 = ["basil-core/unlock-bip39"]

[dependencies]
# Used by the shared harness (`src/lib.rs`) to base64 the out-of-band public
# halves an invocation boot provisions into the dev engine.
base64 = { workspace = true, features = ["std"] }
basil-core = { workspace = true, features = ["http", "unlock-age-yubikey", "unlock-bip39"] }
basil-proto = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
rustix = { workspace = true }
# Not a dev-dep: the shared harness (`src/lib.rs`) installs the pure-Rust `ring`
# rustls `CryptoProvider` before any test builds a `reqwest` client (see
# `ensure_crypto_provider`). `reqwest` itself stays test-only below.
rustls = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
spiffe = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tonic = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
zero-secrets = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
basil = { workspace = true }
basil-cose = { workspace = true }
basil-https-courier = { workspace = true }
basil-nats-bridge = { workspace = true }
basil-proto = { workspace = true }

async-nats = { workspace = true }
bytes = { workspace = true }
cose_minicbor = { version = "0.1.1", default-features = false, features = ["suit-sha256-ed25519"] }
ed25519-dalek = { workspace = true }
hex = { workspace = true }
hyper-util = { workspace = true }
jsonwebtoken = { workspace = true }
minicbor = { workspace = true, features = ["alloc", "std"] }
pkcs8 = { workspace = true }
prost = { workspace = true }
# `rand`/`rsa`/`url`: deterministic runtime-generated RSA trust material and the
# provider document-fetcher seam for `ci_trust_reload_matrix` (no key blobs in
# source; `url` must be the workspace version so the fetcher trait types unify).
rand = { workspace = true }
# Hermetic, test-only CA/server rotation for `ci_trust_reload_matrix`.
rcgen = "=0.13.2"
reqwest = { workspace = true }
rsa = { workspace = true }
sha2 = { workspace = true }
spiffe-rustls = { workspace = true }
tokio-rustls = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tower = { workspace = true }
url = { workspace = true }
x509-parser = { workspace = true }

