[package]
name = "basil-bin"
version.workspace = true
authors.workspace = true
categories = ["cryptography", "command-line-utilities"]
documentation = "https://docs.openbasil.org"
edition.workspace = true
homepage.workspace = true
keywords = ["basil", "vault", "secrets", "cryptography", "cli"]
license.workspace = true
publish = true
repository.workspace = true
rust-version = "1.88"
description = "Basil is a host-local secrets broker: your app never touches the key. Unified broker daemon, operator tool, and client CLI."

[package.metadata.dist]
# Name the Homebrew formula `basil` (not the crate name `basil-bin`) so the
# install is `brew install openbasil/tap/basil`.
formula = "basil"

[[bin]]
name = "basil"
path = "src/main.rs"

[features]
default = ["db-keystore", "onepassword", "unlock-age-yubikey", "unlock-bip39"]
http = ["basil-core/http"]
http-tls = ["http", "basil-core/http-tls"]
keystore-backend = ["basil-core/keystore-backend"]
db-keystore = ["keystore-backend", "basil-core/db-keystore"]
onepassword = ["keystore-backend", "basil-core/onepassword"]
# aws-kms and gcp-kms add about ~10MB to the bin size due to large SDKs
aws-kms = ["basil-core/aws-kms"]
gcp-kms = ["basil-core/gcp-kms"]
# yubikey support still experimental
unlock-age-yubikey = ["basil-core/unlock-age-yubikey"]
unlock-bip39 = ["basil-core/unlock-bip39"]
# tpm is still experimental
unlock-tpm = ["basil-core/unlock-tpm"]
# tpm2 is still experimental
tpm2 = ["basil-core/tpm2"]
otlp = ["basil-core/otlp"]
secure-alloc = ["mimalloc/secure"]

[dependencies]
basil = { workspace = true }
basil-core = { workspace = true }
basil-cose = { workspace = true }
basil-nats = { workspace = true }
basil-proto = { workspace = true }

anyhow = { workspace = true }
base64 = { workspace = true, features = ["std"] }
clap = { workspace = true }
clap_complete = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
mimalloc = { workspace = true }
prost = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
x25519-dalek = { workspace = true }
x509-parser = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tokio-stream = { workspace = true }

[lints]
workspace = true
