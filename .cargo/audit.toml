[advisories]
# Mirror the reviewed exceptions in deny.toml so `cargo audit` and
# `cargo deny` apply one repository-local policy. `RUSTSEC-2026-0173` is the
# temporary testing exception for age 0.11.5; the pinned Rage revision removes
# the affected dependency, and this entry goes away with the Git pin.
ignore = [
  "RUSTSEC-2023-0071",
  "RUSTSEC-2025-0134",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0173",
]
